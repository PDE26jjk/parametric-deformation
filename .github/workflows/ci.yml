name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Bump together with the download URL pattern below.
  BLENDER_SERIES: "4.5"
  BLENDER_VERSION: "4.5.6"

jobs:
  pack-schema:
    name: Pack schema (no Blender)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Validate the example pack
        run: python -m parametric_deformation.tools.validate_pack examples/minimal_pack

  headless-checks:
    name: Blender headless checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL "$url" -o /tmp/blender.tar.xz
          mkdir -p /opt/blender
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version
      - name: Run the checks against the example pack
        run: |
          set -euo pipefail
          for check in blender_smoke blender_operator_check blender_rig_check \
                       blender_morph_check blender_detach_check \
                       blender_preset_check blender_action_check; do
            echo "::group::$check"
            /opt/blender/blender --background --factory-startup \
              --python "parametric_deformation/tools/${check}.py" \
              -- examples/minimal_pack
            echo "::endgroup::"
          done
      - name: Validate and build the extension
        run: |
          set -euo pipefail
          /opt/blender/blender --command extension validate parametric_deformation
          mkdir -p dist
          /opt/blender/blender --command extension build \
            --source-dir parametric_deformation --output-dir dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
